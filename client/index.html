<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tracksup" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>Tracksup</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      body {
        padding-top: var(--sat);
        padding-bottom: var(--sab);
      }
      /* Ensure the mobile nav and menu account for safe areas */
      nav {
        padding-top: var(--sat) !important;
        height: calc(4rem + var(--sat)) !important;
      }
      @media (min-width: 768px) {
        nav {
          height: calc(5rem + var(--sat)) !important;
        }
      }
      /* Theme Cycle Button for Mobile - Top Right */
      #mobile-theme-fab {
        position: fixed;
        top: calc(12px + var(--sat));
        right: 70px; /* Offset to not overlap the menu button */
        z-index: 10000;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(16, 185, 129, 0.1);
        backdrop-filter: blur(8px);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      #mobile-theme-fab:active {
        transform: scale(0.9);
      }
      @media (min-width: 1024px) {
        #mobile-theme-fab {
          display: none;
        }
      }

      /* Theme Contrast Overrides for Dark/Midnight */
      body[data-theme='dark'] nav span.italic,
      body[data-theme='midnight'] nav span.italic {
        color: white !important;
      }
      
      body[data-theme='dark'] h1,
      body[data-theme='midnight'] h1 {
        color: white !important;
      }

      body[data-theme='dark'] h1 span,
      body[data-theme='midnight'] h1 span {
        color: rgba(255, 255, 255, 0.15) !important;
      }

      body[data-theme='dark'] .absolute.italic.tracking-tighter.leading-none,
      body[data-theme='midnight'] .absolute.italic.tracking-tighter.leading-none {
        color: rgba(255, 255, 255, 0.05) !important;
      }

      body[data-theme='midnight'] p.transition-colors {
        color: #94a3b8 !important; /* text-slate-400 */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
